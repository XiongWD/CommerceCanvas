<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="演示素材：耳机卖点图，突出续航特性图标">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181d25"/><stop offset="100%" stop-color="#090c11"/>
    </linearGradient>
    <radialGradient id="cup3" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#475060"/><stop offset="60%" stop-color="#232934"/><stop offset="100%" stop-color="#0c0f14"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg3)"/>
  <!-- 左侧卖点信息块（无品牌文字，仅构图）-->
  <rect x="90" y="360" width="40" height="40" rx="8" fill="#4d8dff" opacity="0.5"/>
  <rect x="150" y="368" width="220" height="26" rx="3" fill="#b4b9c1" opacity="0.22"/>
  <rect x="150" y="406" width="280" height="18" rx="3" fill="#b4b9c1" opacity="0.12"/>
  <!-- 右侧商品：单耳罩特写 -->
  <g transform="translate(640,300)">
    <ellipse cx="180" cy="360" rx="240" ry="20" fill="#000" opacity="0.4"/>
    <ellipse cx="180" cy="240" rx="170" ry="190" fill="url(#cup3)"/>
    <ellipse cx="180" cy="240" rx="120" ry="140" fill="#0a0d12"/>
    <!-- 续航图标占位（电池形状，非品牌）-->
    <rect x="120" y="206" width="120" height="60" rx="8" fill="none" stroke="#3fb98f" stroke-width="6"/>
    <rect x="240" y="222" width="10" height="28" rx="3" fill="#3fb98f"/>
    <rect x="128" y="214" width="80" height="44" rx="3" fill="#3fb98f" opacity="0.7"/>
  </g>
</svg>
