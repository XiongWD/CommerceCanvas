<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="演示素材：参数图，商品主体加规格信息块">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14181f"/><stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <radialGradient id="cup5" cx="40%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#48515f"/><stop offset="60%" stop-color="#242a34"/><stop offset="100%" stop-color="#0d1015"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg5)"/>
  <!-- 网格底纹（参数图常用）-->
  <g stroke="#1c222b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="600" x2="1200" y2="600"/><line x1="0" y1="900" x2="1200" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="1200"/><line x1="600" y1="0" x2="600" y2="1200"/><line x1="900" y1="0" x2="900" y2="1200"/>
  </g>
  <!-- 右侧商品：等比正视耳机 -->
  <g transform="translate(640,300)">
    <ellipse cx="200" cy="560" rx="300" ry="24" fill="#000" opacity="0.4"/>
    <path d="M -10 240 Q 200 -30 410 240" fill="none" stroke="#2a313c" stroke-width="32" stroke-linecap="round"/>
    <ellipse cx="0" cy="260" rx="86" ry="104" fill="url(#cup5)"/>
    <ellipse cx="0" cy="260" rx="60" ry="76" fill="#0a0d12"/>
    <ellipse cx="400" cy="260" rx="86" ry="104" fill="url(#cup5)"/>
    <ellipse cx="400" cy="260" rx="60" ry="76" fill="#0a0d12"/>
  </g>
  <!-- 左侧参数块（无品牌数值，仅构图线）-->
  <g transform="translate(90,300)">
    <rect width="40" height="40" rx="6" fill="#e0a93a" opacity="0.5"/>
    <rect x="56" y="6" width="200" height="12" rx="2" fill="#b4b9c1" opacity="0.2"/>
    <rect x="56" y="26" width="240" height="10" rx="2" fill="#b4b9c1" opacity="0.12"/>
    <g transform="translate(0,80)">
      <rect width="40" height="40" rx="6" fill="#4d8dff" opacity="0.4"/>
      <rect x="56" y="6" width="180" height="12" rx="2" fill="#b4b9c1" opacity="0.2"/>
      <rect x="56" y="26" width="220" height="10" rx="2" fill="#b4b9c1" opacity="0.12"/>
    </g>
    <g transform="translate(0,160)">
      <rect width="40" height="40" rx="6" fill="#3fb98f" opacity="0.4"/>
      <rect x="56" y="6" width="210" height="12" rx="2" fill="#b4b9c1" opacity="0.2"/>
      <rect x="56" y="26" width="180" height="10" rx="2" fill="#b4b9c1" opacity="0.12"/>
    </g>
  </g>
</svg>
