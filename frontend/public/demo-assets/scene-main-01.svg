<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="演示素材：开放式耳机主图，右侧主体左侧文案">
  <!-- 背景：深灰工作场景渐变（无品牌）-->
  <defs>
    <radialGradient id="bgM" cx="68%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#2a323e"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0b0e13"/>
    </radialGradient>
    <linearGradient id="bodyM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4250"/>
      <stop offset="50%" stop-color="#222833"/>
      <stop offset="100%" stop-color="#11151c"/>
    </linearGradient>
    <radialGradient id="cupM" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#4a5260"/>
      <stop offset="60%" stop-color="#252b35"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </radialGradient>
    <linearGradient id="meshM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f27"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgM)"/>
  <!-- 背景柔和冷光 -->
  <circle cx="820" cy="380" r="380" fill="#4d8dff" opacity="0.05"/>

  <!-- 左侧文案占位（非真实文字，仅构图块）-->
  <rect x="90" y="430" width="300" height="34" rx="3" fill="#b4b9c1" opacity="0.22"/>
  <rect x="90" y="486" width="230" height="20" rx="3" fill="#b4b9c1" opacity="0.14"/>
  <rect x="90" y="520" width="260" height="20" rx="3" fill="#b4b9c1" opacity="0.12"/>
  <rect x="90" y="600" width="150" height="44" rx="4" fill="#4d8dff" opacity="0.28"/>

  <!-- 右侧商品主体：开放式头戴耳机（无 Logo / 无型号）-->
  <g transform="translate(720,360)">
    <!-- 头梁 -->
    <path d="M -10 220 Q 200 -40 410 220" fill="none" stroke="url(#bodyM)" stroke-width="34" stroke-linecap="round"/>
    <path d="M -10 220 Q 200 -28 410 220" fill="none" stroke="#4a5260" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <!-- 左耳罩 -->
    <ellipse cx="0" cy="240" rx="92" ry="108" fill="url(#cupM)"/>
    <ellipse cx="0" cy="240" rx="64" ry="80" fill="url(#meshM)"/>
    <circle cx="0" cy="240" r="20" fill="#2a313c" opacity="0.8"/>
    <!-- 右耳罩 -->
    <ellipse cx="400" cy="240" rx="92" ry="108" fill="url(#cupM)"/>
    <ellipse cx="400" cy="240" rx="64" ry="80" fill="url(#meshM)"/>
    <circle cx="400" cy="240" r="20" fill="#2a313c" opacity="0.8"/>
    <!-- 连接铰链 -->
    <rect x="-22" y="150" width="44" height="60" rx="6" fill="url(#bodyM)"/>
    <rect x="378" y="150" width="44" height="60" rx="6" fill="url(#bodyM)"/>
    <!-- 接触阴影 -->
    <ellipse cx="200" cy="560" rx="320" ry="28" fill="#000" opacity="0.45"/>
  </g>
</svg>
